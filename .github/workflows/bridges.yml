# Build the Rust doors this package publishes, on both platforms, and pin
# them.
#
# THIS WORKFLOW PUBLISHES NOTHING.  It has `contents: read` and no other
# permission, no `environment`, and no `id-token`, so it holds no PyPI
# identity and no authority to write to a release.  What it produces is two
# build artifacts and a pins document; publish.yml is the only file that can
# attach them to anything, and every job in that file is gated on a
# repository variable that only a deliberate act in the repository settings
# sets.
#
# WHY THIS FILE EXISTS AT ALL.  The wheel carries no Rust.  Eight of the
# fourteen binaries the model runs on are published by this package rather
# than by the engine: six have no binary in any published bundle, and two
# (rw_asos, rw_goes) exist in the engine's bundle under the same filename in
# an older build with none of the subcommands this package calls.  Without a
# bundle, obtaining those eight means a Rust toolchain, a source checkout and
# a few minutes of compiling, which by the rule that a capability a user
# cannot reach does not exist means eight doors were never shipped.
#
# WHERE THE CRATES COME FROM.  The observation and radiance doors come from
# the engine's `tools/rustwx` workspace and stay there: two copies of a
# decoder is how the two drift.  Two doors, `rw_global_coldstart` and
# `global_render_kernels`, come from this repository's own `rust/`
# workspace: the cold start's analysis regrid and remap, and the render
# tapes' regrid and the regional translation, which nothing in the engine
# does, so there is no engine copy to drift from.  They are stamped with
# this repository's commit and pinned against it (`pin --package-rev`).
# This workflow checks the engine's public repository
# out at the tag `ENGINE_TAG` names below (or the revision passed in) and
# builds only the targets this package's bundle carries.
#
# WHICH TAG.  Through 0.1.1 the bundle was built from a private revision of
# the model's source tree that no public repository carried, so nobody could
# rebuild the published doors from public source.  The crates (rw-atms, the
# five global rw-obs binaries, and the rw_asos and rw_goes subcommands this
# package calls) are public from engine tag `v2.8.0`, and this workflow
# builds from it.  If a revision passed in lacks a target, the `preflight`
# job FAILS NAMING THE MISSING ONES rather than producing a bundle with holes
# in it.  The breakage that prevents: a release page carrying an eight-door
# bundle that holds four doors, whose users get a missing-subcommand error
# deep inside a DA cycle.
#
# WHAT THIS BUILD IS, AND WHAT IT IS NOT.  It proves the eight doors build
# from public source at ENGINE_TAG, carry their licence notice and embed no
# build-machine path.  It does not make the released bytes, and nothing
# compares its output with them.  The bundles a release carries are the
# ones `src/arwen_global/data/door-pins.json` pins: built from the same tag
# for x86_64-unknown-linux-gnu and, cross-built with cargo-zigbuild, for
# x86_64-pc-windows-gnu, then attached to the release before it is
# published.  A runner's toolchain is not that build's, and the Windows job
# below links with MSVC, so the bytes and the pins document this workflow
# produces are informational and are never committed.
#
# WHAT THE BUILD GUARANTEES BEYOND THE BYTES.  Every door is built with
# --remap-path-prefix for the engine checkout, the Cargo home and the
# rustup home, and each bundle carries THIRD-PARTY-LICENSES.txt generated
# from the engine's Cargo.lock for that target.  `build_door_bundle.py pin`
# refuses a bundle with no notice or with a build machine's path in any
# member (NUL-stripped scan).  0.1.1's bundles had neither property: about
# 2,300 home-directory paths across the sixteen binaries, and no licence
# text for the crates statically linked into them.

name: bridges

on:
  workflow_call:
    inputs:
      engine_ref:
        description: >-
          The engine tag or revision to build the doors from.  Defaults to
          ENGINE_TAG, the public engine tag that carries the door crates.
        type: string
        required: false
        default: ""
    outputs:
      bundle_artifact_prefix:
        description: The artifact name prefix each platform's bundle is uploaded under.
        value: ${{ jobs.declare.outputs.bundle_artifact_prefix }}
      platforms:
        description: Space-separated platform keys this run built bundles for.
        value: ${{ jobs.declare.outputs.platforms }}
      engine_ref:
        description: The engine revision the doors were actually built from.
        value: ${{ jobs.declare.outputs.engine_ref }}
  workflow_dispatch:
    inputs:
      engine_ref:
        description: Engine revision to build from (blank = the packaged pin)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: bridges-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # The engine's public repository.  The crates are read from it and never
  # copied into this one.
  ENGINE_REPOSITORY: FahrenheitResearch/arwen
  # The first public engine tag carrying the door crates.  The commit it
  # names is resolved in `preflight` and is what every door is stamped with
  # and pinned against.
  ENGINE_TAG: v2.8.0
  ARTIFACT_PREFIX: arwen-global-doors

jobs:
  # ---------------------------------------------------------------------
  # 1.  What this run is going to build, decided once and read by the rest.
  #     The release string and the engine revision both come out of the
  #     packaged pins so there is no second place to state either.
  # ---------------------------------------------------------------------
  declare:
    runs-on: ubuntu-latest
    outputs:
      bundle_artifact_prefix: ${{ env.ARTIFACT_PREFIX }}
      platforms: ${{ steps.read.outputs.platforms }}
      engine_ref: ${{ steps.read.outputs.engine_ref }}
      release: ${{ steps.read.outputs.release }}
      doors: ${{ steps.read.outputs.doors }}
      package_doors: ${{ steps.read.outputs.package_doors }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - id: read
        env:
          REQUESTED_REF: ${{ inputs.engine_ref }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, "tools")
          from pathlib import Path
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              "doors", "src/arwen_global/doors.py")
          doors = importlib.util.module_from_spec(spec)
          # Registered before it executes: doors.py declares dataclasses,
          # and dataclasses resolve a field's annotation through
          # sys.modules[cls.__module__]; a module executed from a spec and
          # never registered is None there, and the first public run of this
          # job died on that AttributeError before it read the pins.
          sys.modules[spec.name] = doors
          spec.loader.exec_module(doors)
          pins = json.loads(
              Path("src/arwen_global/data/door-pins.json").read_text("utf-8"))
          requested = os.environ.get("REQUESTED_REF", "").strip()
          engine = requested or os.environ.get("ENGINE_TAG", "").strip()
          if not engine:
              raise SystemExit(
                  "bridges: no engine tag or revision to build from.  "
                  "ENGINE_TAG is empty and none was passed in, so there is "
                  "nothing that says which public source these binaries "
                  "would come from.")
          published = doors.doors_from_bundle(doors.COMPANION_BUNDLE)
          names = [d.name for d in published
                   if not doors.built_from_this_repository(d)]
          here = [d.crate for d in published
                  if doors.built_from_this_repository(d)]
          print(f"engine_ref={engine}")
          print(f"release={pins.get('release') or 'v0.0.0-dev'}")
          print("platforms=" + " ".join(doors.SUPPORTED_PLATFORMS))
          print("doors=" + " ".join(names))
          print("package_doors=" + " ".join(here))
          PY
      - run: |
          echo "engine   ${{ steps.read.outputs.engine_ref }}"
          echo "release  ${{ steps.read.outputs.release }}"
          echo "doors    ${{ steps.read.outputs.doors }}"
          echo "here     ${{ steps.read.outputs.package_doors }}"

  # ---------------------------------------------------------------------
  # 2.  Does the engine checkout actually carry what this builds?
  #
  #     THE BREAKAGE THIS PREVENTS: a bundle that packs whatever targets
  #     happened to build, published as the eight doors, whose missing
  #     members surface as an unknown-subcommand error in the middle of a
  #     user's DA cycle rather than at the door.  Asked once, before any
  #     compiling, so a run that cannot succeed says why in its first
  #     minute.
  # ---------------------------------------------------------------------
  preflight:
    needs: declare
    runs-on: ubuntu-latest
    outputs:
      engine_commit: ${{ steps.commit.outputs.engine_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: package
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.ENGINE_REPOSITORY }}
          ref: ${{ needs.declare.outputs.engine_ref }}
          persist-credentials: false
          path: engine
      - id: commit
        name: the commit the tag names, which every door is stamped with
        run: echo "engine_commit=$(git -C engine rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: every crate and binary target this run needs is present
        env:
          DOORS: ${{ needs.declare.outputs.doors }}
        run: |
          set -uo pipefail
          missing=()
          for door in $DOORS; do
            hits=$(grep -rl "name = \"${door}\"" engine/tools/rustwx/crates/*/Cargo.toml 2>/dev/null || true)
            if [ -z "$hits" ]; then
              missing+=("$door")
            else
              echo "ok   ${door}  <-  ${hits}"
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo >&2
            echo "bridges: the engine checkout at ${{ needs.declare.outputs.engine_ref }} of ${ENGINE_REPOSITORY} declares no binary target for: ${missing[*]}" >&2
            echo "bridges: the door crates are not in that engine revision.  They are public from engine tag v2.8.0; a partial bundle is worse than none: its members would fail as an unknown subcommand inside a run rather than at the door." >&2
            echo "bridges: the remedy is ENGINE_TAG in this file, or the engine_ref passed in, set to an engine tag at or after v2.8.0, which carries crates/rw-atms, the five rw-obs binaries and the rw_asos and rw_goes subcommands." >&2
            exit 1
          fi

  # ---------------------------------------------------------------------
  # 3.  Build and pack, one job per platform.  `--locked --offline` against
  #     the workspace's own vendored closure, so the bytes do not depend on
  #     what crates.io served that morning, and GPUWM_BRIDGE_SOURCE_REV is
  #     set explicitly because a CI checkout's HEAD is the package's, not
  #     the engine's.
  # ---------------------------------------------------------------------
  build:
    needs: [declare, preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runs-on: ubuntu-latest
          - platform: win-x86_64
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: package
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.ENGINE_REPOSITORY }}
          ref: ${{ needs.declare.outputs.engine_ref }}
          persist-credentials: false
          path: engine
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: remap every build-machine path out of the binaries
        # rustc writes the source path of every panic location into the
        # binary.  The three roots it can see are remapped to neutral
        # prefixes, spelled the way this runner's OS spells them, and MSVC
        # gets the PDB's bare file name instead of its full path.
        run: |
          python - >> "$GITHUB_ENV" <<'PY'
          import os, sys
          from pathlib import Path
          home = Path.home()
          roots = {
              str(Path("engine").resolve()): "/build/engine",
              str(Path("package").resolve()): "/build/package",
              os.environ.get("CARGO_HOME") or str(home / ".cargo"): "/build/cargo",
              os.environ.get("RUSTUP_HOME") or str(home / ".rustup"): "/build/rustup",
          }
          flags = [f"--remap-path-prefix={src}={dst}" for src, dst in roots.items()]
          if sys.platform == "win32":
              flags.append("-C link-arg=/PDBALTPATH:%_PDB%")
          print("RUSTFLAGS=" + " ".join(flags))
          PY
      - name: build the door targets
        working-directory: engine/tools/rustwx
        env:
          GPUWM_BRIDGE_SOURCE_REV: ${{ needs.preflight.outputs.engine_commit }}
          DOORS: ${{ needs.declare.outputs.doors }}
        run: |
          set -euo pipefail
          args=()
          for door in $DOORS; do args+=(--bin "$door"); done
          # One cargo invocation so the workspace resolves once and every
          # door is built against the same dependency graph.
          cargo build --release --locked --offline \
            -p rw-obs -p rw-goes -p rw-atms "${args[@]}"
      # The doors built from this package's own rust/ workspace (the cold
      # start's regrid and remap, and the render kernels), stamped with
      # THIS repository's commit, which `pin --package-rev` then checks.  std-only, so --locked
      # --offline needs no registry.
      - name: build the doors this package's own rust/ workspace carries
        working-directory: package/rust
        env:
          GPUWM_BRIDGE_SOURCE_REV: ${{ github.sha }}
        run: cargo build --release --locked --offline
      - name: pack the bundle
        working-directory: package
        env:
          RELEASE: ${{ needs.declare.outputs.release }}
        run: |
          python tools/build_door_bundle.py pack \
            --release "$RELEASE" \
            --platform ${{ matrix.platform }} \
            --search ../engine/tools/rustwx/target/release rust/target/release \
            --workspace ../engine/tools/rustwx \
            --out dist-doors
      - name: no build-machine path in any member (NUL-stripped scan)
        working-directory: package
        run: python tools/build_door_bundle.py scan dist-doors/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ matrix.platform }}
          path: package/dist-doors/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # 4.  Pin, on one machine, from the bundles the build jobs produced.
  #     Every number written is a hash of bytes that exist here now.  The
  #     source-revision stamp is checked out of each member without running
  #     it, so a bundle predating the declared engine revision is refused
  #     before it can become a perfectly-pinned release asset.
  # ---------------------------------------------------------------------
  pin:
    needs: [declare, preflight, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          pattern: ${{ env.ARTIFACT_PREFIX }}-*
          path: bundles
          merge-multiple: true
      - name: pin the bundles into the packaged pins document
        env:
          RELEASE: ${{ needs.declare.outputs.release }}
          ENGINE_REF: ${{ needs.preflight.outputs.engine_commit }}
        run: |
          set -euo pipefail
          ls -l bundles/
          python tools/build_door_bundle.py pin \
            --release "$RELEASE" \
            --source-rev "$ENGINE_REF" \
            --engine-rev "$ENGINE_REF" \
            --package-rev "${{ github.sha }}" \
            bundles/*.zip
          git --no-pager diff --stat -- src/arwen_global/data/door-pins.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: door-pins
          path: src/arwen_global/data/door-pins.json
          if-no-files-found: error
