# The surface a public cut of gpuwm-global can break on a runner with no
# CUDA device.  Everything that genuinely needs a card carries the `gpu`
# marker and is deselected here by name, never by an `addopts` line that
# would make a bare `pytest` quietly shorter than it looks.
#
# There is no publish job in this workflow and that is deliberate.  A
# workflow able to publish on a push or on a tag is a standing
# pre-authorisation.  Publishing lives in publish.yml, and there it is
# additionally gated on a repository variable that only a deliberate act in
# the repository settings sets.
#
# WHAT IS PROVEN HERE IS THE WHEEL, NOT THE CHECKOUT.  The job builds the
# distribution and installs it into a fresh environment, then runs the
# suite from the repository root.  With a `src/` layout the root is not
# importable, so `import arwen_global` can only resolve to site-packages:
# a module that never reached the wheel, an entry point that points at
# nothing, or a data file outside the declaration all fail here and are
# invisible to a run against `src/`.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:
  # The full CPU tier, nightly.  See the `full` job.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: test-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"

jobs:
  # -------------------------------------------------------------------------
  # The publish-ordering blocker, on its own job so its failure says what it
  # means and does not read as a defect in this repository.
  # -------------------------------------------------------------------------
  engine_availability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # THE BREAKAGE THIS NAMES: gpuwm-global hard-depends on the engine
      # range declared in pyproject.toml.  A floor raised to an engine
      # version that is not on PyPI yet (the state of every floor raise until
      # the engine publishes; the floor 2.8.0 is published) means
      # `pip install gpuwm-global` cannot succeed for anybody, and the test
      # job below fails inside a
      # resolver message that reads like a network problem.  This job says
      # the real thing once, in one place, and the specifier is READ from
      # the declaration rather than restated: the hex line restated its
      # engine floor in four places and the copies drifted apart.
      - name: the declared engine ranges must be resolvable before a cut
        run: |
          python -m pip install --upgrade pip
          FLOOR=$(python -c "import tomllib,pathlib;d=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'));print(' '.join(s for s in d['project']['dependencies'] if s.split('>')[0].split('=')[0].split('<')[0].strip() in ('gpuwm','gpuwm-data')))")
          echo "declared engine ranges: ${FLOOR}"
          python -m pip install --dry-run --ignore-installed ${FLOOR} \
            || { echo "BLOCKER: ${FLOOR} is not installable from PyPI. gpuwm-global cannot be published before the engine versions it depends on are published. This is not a defect in this repository."; exit 1; }

  # -------------------------------------------------------------------------
  # The artefact a user would install, exercised the way a user installs it.
  # -------------------------------------------------------------------------
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.11 is the declared floor and 3.12 is the first interpreter that
        # no longer seeds setuptools into a fresh venv (PEP 632).  Testing
        # only one of them means the other breaks in a user's hands, and the
        # packaging gates in tests/ drive setuptools directly.
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    # MEASURED, not guessed, and the estate MOVES, so the figure carries
    # its host and its date rather than standing alone.  After the model
    # source was re-cut (2026-09-07): 1,586 passing and 102 skipped in
    # 12 min 16 s from the sdist on Windows against a locally built 2.7.0,
    # 1,570 passing and 118 skipped in 7 min 33 s on a 24-core Linux box
    # on python 3.14, and 1,570 passing in 6 min 34 s on a second Linux box
    # on python 3.12 through the replay.  The counts differ by host because
    # dozens of tests skip themselves by name while the engine is behind,
    # which is why a single number here ages within a day and all three
    # are quoted.  After the split into tiers (2026-10-05, a 24-thread
    # Linux CPU host, python 3.11, gpuwm 2.8.5 from PyPI, one process): the
    # quick tier this job runs, 1,908 passed and 82 skipped in 205.6 s; the
    # full tier the `full` job runs, 1,930 passed and 82 skipped in 609.8 s.
    #
    # NO TEST IN THE SELECTION IS A WALL OF ITS OWN.  The slowest single
    # row is 87 s (an IMEX energy gate on Windows) and the slowest ten sum
    # to under 6 minutes, so the job's wall is the suite's and not one
    # test's.  That is worth stating because a 2,064 s reading for one of
    # those gates was taken on a contended box on the same day and would
    # have justified a very different budget.
    # A hosted runner has two cores against those boxes' many, so the
    # budget is the wall time multiplied out, not the wall time. Sixty
    # minutes was the first number written here and it would have killed
    # the job on the runner rather than on the box it was timed on, which
    # is the worst place to discover a timeout.
    timeout-minutes: 150
    steps:
      # Full history, because two tests in the suite compare this branch's
      # stored bytes against `main` to refuse a commit that rewrote a file's
      # line endings.  A single-ref checkout has no `main`, those two skip by
      # name, and the gate that exists for a reviewer would never run where a
      # reviewer reads.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: build the wheel this job will then install
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "setuptools>=77" wheel
          python -m build --wheel --outdir dist
          ls -l dist/

      # The wheel's own dependency table pulls gpuwm from PyPI, which is the
      # motion a user performs.  It is not pinned to a locally built engine
      # here: an install proved against bytes nobody can download proves
      # nothing about the install a user gets.  The local-engine route is
      # tools/ci_test_replay.py, for the window between a floor raise and
      # the engine version it names reaching PyPI.
      - name: install the built wheel, resolving the engine from PyPI
        run: |
          python -m pip install "$(ls dist/*.whl)"
          python -m pip install "pytest>=8.0" "setuptools>=77"

      # THE BREAKAGE THIS PREVENTS: the cold start regrids the analysis and
      # remaps it onto model levels only through the Rust cold-start door,
      # and the render tape and the regional translation run only through
      # the render kernels, both built from this repository's own rust/
      # workspace, with no NumPy body to fall back to.  A suite run without
      # them fails every cold-start, tape and translation gate on a missing
      # door that says nothing about the change under test.  std-only, so
      # --locked --offline resolves with no registry.
      - name: build the doors this package's own rust/ workspace carries
        run: |
          cargo build --release --locked --offline --manifest-path rust/Cargo.toml
          python - >> "$GITHUB_ENV" <<'PY'
          import sys
          from pathlib import Path
          out = Path("rust/target/release").resolve()
          for env, stem in (("GPUWM_GLOBAL_COLDSTART_BRIDGE", "rw_global_coldstart"),
                            ("ARWEN_GLOBAL_RENDER_KERNELS", "global_render_kernels")):
              name = f"{stem}.dll" if sys.platform == "win32" else f"lib{stem}.so"
              path = out / name
              assert path.is_file(), path
              print(f"{env}={path}")
          PY

      - name: the installed distribution answers for itself
        run: |
          python -c "import arwen_global, sys; print(arwen_global.__version__); print(arwen_global.__file__)"
          gpuwm-global --help

      # THE BREAKAGE THIS NAMES: the published 0.1.2 `doctor` exited 1 on
      # every correct install against every published 2.8.x engine, because
      # it graded two engine symbols no documented command reaches as gaps,
      # and the README told readers to ignore the exit code.  Nothing ran
      # doctor where a cut is decided, so a wrong exit code shipped.  These
      # are the README's own install lines, run as a user runs them (the
      # suite holds the two in step), and the job fails on any gap.
      # `fetch-doors` downloads the bundle the wheel's pins name from this
      # version's release page, so on a push made before that release
      # exists (the snapshot that is about to be tagged) there is nothing
      # to download and the step below would fail on a 404 that says
      # nothing about the change.  The probe asks whether this version's
      # bundle is published; when it is not, the step is skipped by name
      # and publish.yml's test job, which runs on the published release
      # before any upload, holds the same doctor exit 0.
      - name: is this version's door bundle published yet
        id: bundle
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import urllib.request
          from arwen_global.doors import bundle_filename, companion_pins, current_platform
          from arwen_global.fetch_doors import asset_url_base
          release = companion_pins().get("release")
          url = f"{asset_url_base(release)}/{bundle_filename(release, current_platform())}"
          try:
              with urllib.request.urlopen(urllib.request.Request(url, method="HEAD"), timeout=60):
                  published = "true"
          except Exception as error:
              published = "false"
              import sys
              print(f"{url}: {error}; doctor waits for the release", file=sys.stderr)
          print(f"published={published}")
          PY
      # The two source-built library overrides exported above are cleared
      # for this step.  THE BREAKAGE THAT PREVENTS: doctor grades whatever
      # an override names against the wheel's pins, and a runner's own
      # build of the cold-start and render libraries is not the pinned
      # bundle, so from 0.1.3 (the first release whose pins carry them)
      # every correct install read as two gaps here.  A user runs these
      # lines with no override, against the bundle fetch-doors staged.
      - name: a correct install, by the README's own lines, answers doctor with exit 0
        if: steps.bundle.outputs.published == 'true'
        env:
          GPUWM_NO_LOCAL_GPU: "1"
          GPUWM_GLOBAL_COLDSTART_BRIDGE: ""
          ARWEN_GLOBAL_RENDER_KERNELS: ""
        run: |
          gpuwm fetch-bridges
          gpuwm-global fetch-doors
          gpuwm-global doctor

      # THE BREAKAGE THESE TWO NAME: a page that names an option the parser
      # dropped, or teaches a command line argparse refuses, sends the reader
      # to an error and the page is the reason.  Both read the INSTALLED
      # parser, so they measure the artefact rather than the checkout, and
      # both rewrite nothing here: --check and the doc reader are read-only.
      # Measured on the analysis quickstart, whose two lines were refused by
      # the parser they documented (2026-09-07).
      - name: the documentation matches the parser it documents
        run: |
          python tools/build_cli_reference.py --check
          python tools/check_doc_examples.py

      # The exact selection.  Written once here; tools/ci_test_replay.py
      # PARSES it out of this file rather than restating it, so a local
      # replay cannot drift behind the job it replays.
      #
      # `-ra`, not `-rs`.  Dozens of modules in this suite skip themselves by
      # name while the engine is behind, and each skip names the missing
      # symbol and the patch item that supplies it, so a run log without skip
      # reasons cannot tell an engine that is behind from a package that is
      # broken.  `-rs` prints those reasons -- and REPLACES pytest's default
      # `fE`, so the run log then lists no failed test at all and a reader has
      # to reconstruct the list from the tracebacks.  `-ra` is both.
      - name: the quick CPU tier (the full tier is the `full` job below)
        env:
          GPUWM_NO_LOCAL_GPU: "1"
        run: |
          python -m pytest -q -ra --durations=15 -p no:cacheprovider -m "not gpu and not slow and not network" tests

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gpuwm-global-wheel-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # The FULL CPU tier: everything a host without a card can run, the
  # whole-model gates the quick tier above schedules out included.  Nightly
  # and on demand here, and on every publish (publish.yml runs this same
  # selection), so a gate that left the per-push tier still decides a cut.
  # tests/conftest.py FULL_TIER names each test the quick tier leaves out
  # and the seconds it took.
  # -------------------------------------------------------------------------
  # The full tier also runs on a release branch and on every pull request:
  # a scheduled workflow runs on the default branch only, so the nightly
  # alone never met the ref being cut before its tag existed.
  full:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'pull_request'
      || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: build and install the wheel, resolving the engine from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "setuptools>=77" wheel "pytest>=8.0"
          python -m build --wheel --outdir dist
          python -m pip install "$(ls dist/*.whl)"
      - name: the full CPU tier
        env:
          GPUWM_NO_LOCAL_GPU: "1"
        run: |
          python -m pytest -q -ra --durations=15 -p no:cacheprovider -m "not gpu" tests
