# Publish gpuwm-global to PyPI through Trusted Publishing, and attach the
# companion door bundles to the GitHub release.
#
# PUBLISHING IS DISABLED BY CONSTRUCTION, AND THIS IS THE STATEMENT OF IT.
# Every job below carries
#
#     if: vars.GPUWM_GLOBAL_PUBLISH_AUTHORIZED == '1'
#
# and a missing variable evaluates to the empty string, so without it every
# job is skipped, the workflow completes having done nothing, and no upload
# is attempted.  Setting that variable to 1 is a deliberate act in the
# repository settings, performed by the owner, and it is the only thing
# between this file and a live publisher.  It
# is not a secret, it holds no credential, and it grants none: it is a switch
# that has to be thrown by hand, once, by somebody who meant to.
#
# The file is written now rather than later because the shape has to be
# reviewable before it is armed, and because a trusted publisher registration
# binds the workflow FILENAME.  PyPI issues its token against four things:
#
#     FahrenheitResearch / gpuwm-global / publish.yml / pypi
#
# Renaming this file, moving the upload into another workflow, or changing the
# environment name breaks that binding, and the failure reads as a missing API
# token, which it is not.  Change the registration on PyPI first, then here.
#
# No API token, no password and no secret is read anywhere in this file.  OIDC
# means the runner proves its own identity to PyPI, so there is no long-lived
# credential to leak, to rotate, or to print by accident.
#
# The only automatic trigger is `release: published`.  Publishing a GitHub
# release is a deliberate human act on a specific tag; a workflow that fired
# on a push or on a tag alone would be a standing pre-authorisation, which is
# the thing this repository does not have.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact vX.Y.Z tag this run is cutting
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # -------------------------------------------------------------------------
  # 1.  The same tests the cut has to pass, run once more against the exact
  #     ref being published rather than trusting a green run from a branch.
  # -------------------------------------------------------------------------
  test:
    if: vars.GPUWM_GLOBAL_PUBLISH_AUTHORIZED == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: build and install the wheel, resolving the engine from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "setuptools>=77" wheel "pytest>=8.0"
          python -m build --wheel --outdir dist
          python -m pip install "$(ls dist/*.whl)"
      # The identical selection test.yml runs.  Stated here as well because a
      # publish that trusts another workflow's green is trusting a run against
      # another ref; tests/test_ci_workflows.py fails if the two ever differ.
      - name: the CPU-runnable estate
        env:
          GPUWM_NO_LOCAL_GPU: "1"
        run: |
          python -m pytest -q -ra -p no:cacheprovider -m "not gpu and not slow and not network" tests

  # -------------------------------------------------------------------------
  # 2.  The version under the tag, established once and passed on, so every
  #     job below compares against one captured value instead of each
  #     re-deriving it from a tree that could have moved underneath.
  # -------------------------------------------------------------------------
  cut:
    if: vars.GPUWM_GLOBAL_PUBLISH_AUTHORIZED == '1'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: the tag and the declaration name the same version
        id: identity
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-$DISPATCH_TAG}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "the tag being cut must be vX.Y.Z; got ${tag}" >&2; exit 1 ;;
          esac
          declared=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          test "${tag#v}" = "$declared" || {
            echo "tag ${tag} against declared version ${declared}" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$declared" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # 3.  The distributions, built once and proven by digest from here on, so
  #     that the bytes PyPI receives are the bytes that passed.
  # -------------------------------------------------------------------------
  prepare:
    if: vars.GPUWM_GLOBAL_PUBLISH_AUTHORIZED == '1'
    needs: cut
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: build and check the sdist and the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine "setuptools>=77" wheel
          python -m build
          python -m twine check --strict dist/*
      - name: the built distributions carry the version being cut
        env:
          VERSION: ${{ needs.cut.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/gpuwm_global-"$VERSION"-*.whl)
          sdists=(dist/gpuwm_global-"$VERSION".tar.gz)
          everything=(dist/*)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ] || [ "${#everything[@]}" -ne 2 ]; then
            echo "dist/ must hold exactly one wheel and one sdist at version ${VERSION}" >&2
            ls -l dist/ >&2
            exit 1
          fi
          (cd dist && sha256sum -- * > ../python-dists-SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dists
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-proof
          path: python-dists-SHA256SUMS
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 4.  The door bundles.  bridges.yml checks the engine's public line out at
  #     ENGINE_TAG (v2.8.0, the first public engine tag that carries the door
  #     crates) and builds the eight doors on Linux and Windows, which proves
  #     on every cut that they build from public source.  It gates nothing:
  #     the bundles a release carries are built from the same tag, packed and
  #     pinned by tools/build_door_bundle.py into the wheel's own
  #     door-pins.json, and attached to the release BEFORE it is published.
  #     A runner's toolchain is not that build's, and its Windows job links
  #     with MSVC where the released Windows doors are x86_64-pc-windows-gnu,
  #     so the bytes it produces are informational.  Section 6 below checks
  #     the attached bytes against the wheel's pins, which is a stronger
  #     check than trusting a build.
  # -------------------------------------------------------------------------
  doors:
    if: vars.GPUWM_GLOBAL_PUBLISH_AUTHORIZED == '1'
    needs: cut
    uses: ./.github/workflows/bridges.yml
    permissions:
      contents: read

  # -------------------------------------------------------------------------
  # 5.  PyPI, and nothing else.  No checkout, no rebuild, no GitHub write
  #     authority: this cell holds the PyPI identity and cannot touch the
  #     repository, and the cell that promotes the release holds
  #     contents: write and has no PyPI identity.  Neither can do the other's
  #     damage.
  # -------------------------------------------------------------------------
  publish:
    if: vars.GPUWM_GLOBAL_PUBLISH_AUTHORIZED == '1'
    needs: [cut, prepare]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dists
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-proof
          path: release-proof
      - name: the bytes about to be uploaded are the bytes that passed
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c ../release-proof/python-dists-SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

  # -------------------------------------------------------------------------
  # 6.  The GitHub release page, and only after PyPI.  The failure mode of
  #     this order is a live PyPI version whose release page has no
  #     distributions attached yet, which a re-run fixes.  The other order
  #     fails the other way, with a release page advertising a version that
  #     does not exist on PyPI, which a re-run cannot fix because the tag is
  #     spent.
  #
  #     THE BREAKAGE THE BUNDLE CHECK PREVENTS: a release page that carries a
  #     bundle for one platform and none for the other, or a bundle whose
  #     bytes are not the ones the wheel's door-pins.json names, so a user who
  #     follows the printed fetch-doors line gets a door that is refused by
  #     the very pins that shipped beside it.  Every platform the pins declare
  #     must already be on the release page with exactly the pinned bytes.
  # -------------------------------------------------------------------------
  release:
    if: vars.GPUWM_GLOBAL_PUBLISH_AUTHORIZED == '1'
    needs: [cut, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dists
          path: dist
      - name: every platform the pins declare has its bundle on the release page, with the pinned bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.cut.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p door-bundles
          python - <<'PY' > expected.tsv
          import json
          from pathlib import Path
          pins = json.loads(Path("src/arwen_global/data/door-pins.json").read_text("utf-8"))
          platforms = pins.get("platforms") or {}
          if not platforms:
              raise SystemExit("door-pins.json declares no platforms, so nothing says which bundles this release must carry")
          for platform, record in sorted(platforms.items()):
              bundle = record["bundle"]
              print(f"{platform}\t{bundle['filename']}\t{bundle['sha256']}\t{bundle['bytes']}")
          PY
          cat expected.tsv
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > attached.txt
          failed=0
          while IFS=$'\t' read -r platform filename sha256 bytes; do
            if ! grep -qx "$filename" attached.txt; then
              echo "platform ${platform}: the pins name ${filename} and the release page carries no asset by that name" >&2
              failed=1
              continue
            fi
            gh release download "$RELEASE_TAG" --pattern "$filename" --dir door-bundles --clobber
            actual=$(sha256sum "door-bundles/${filename}" | cut -c1-64)
            size=$(stat -c %s "door-bundles/${filename}")
            if [ "$actual" != "$sha256" ] || [ "$size" != "$bytes" ]; then
              echo "platform ${platform}: ${filename} on the release page is ${size} B ${actual}; the wheel's pins say ${bytes} B ${sha256}" >&2
              failed=1
            else
              echo "ok   ${platform}  ${filename}  ${bytes} B  ${sha256}"
            fi
          done < expected.tsv
          test "$failed" -eq 0
      - name: attach the distributions to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.cut.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'
