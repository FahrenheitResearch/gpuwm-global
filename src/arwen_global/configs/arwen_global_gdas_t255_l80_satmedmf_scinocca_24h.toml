# T255 L80 with the SA-TKE-EDMF boundary layer and the Scinocca
# non-orographic gravity-wave drag, a forecast day on the semi-Lagrangian
# core: an OPT-IN configuration of 0.4.0.  The default forecast day
# (arwen_global_gdas_t255_native_sl_si_24h, 40 levels, YSU, no
# non-orographic drag) is unchanged.  Its twin with YSU is
# arwen_global_gdas_t255_l80_ysu_scinocca_24h.
#
# The vertical grid is ifs_class, 80 levels to a 1 hPa lid, with a graded
# top sponge from 50 hPa.  The physics is the 80-level recipe measured
# before release over five days from GDAS 2026-11-10 00Z on an RTX 5070 Ti:
# New Tiedtke cumulus at adjustment-time factor 0.35, Morrison, RRTMGP
# with the 5,000-column radiation chunk (the 12,500-column chunk outgrew a
# 16 GB card), Noah, kim-gwdo orographic drag, the Scinocca drag and the
# boundary layer named above.  pbl = "satmedmf" is the single-precision
# port; "satmedmf_fp64" runs the engine's double-precision column, the
# proof route.  The aerosol is off ("none"); radiation_aerosol =
# "tegen-wrf" turns on WRF's aer_opt = 1 climatology.
#
# Not a default, and no skill is claimed for it: against YSU at 80 levels
# the boundary layer's score was mixed on the one date scored at home.
# The case is the README's GDAS 2026-09-01 00Z analysis, as for the
# default day.
#
# A known limit of the 80-level recipe: in the SA-TKE-EDMF day run 5 days
# from 2026-11-11 00Z, rain fell in regular streaks, running roughly
# north-south about 1 degree apart, over the tropical and subtropical east
# Pacific (72 and 120 h), and light rain covered most of the subtropical
# oceans where the 40-level default had none.  The light rain shows at
# 24 h from 2026-09-01 00Z with either boundary layer at 80 levels.
[arwen_global]
schema = "gpuwm.arwen-global-run/v1"
name = "arwen-global-gdas-t255-l80-satmedmf-scinocca-24h"
acknowledgement = "research-only-arwen-global-v1"
backend = "cupy"
precision = "float32"

[grid]
truncation = 255
dealias_factor = 1.5

[time]
dt_s = 300.0
duration_s = 86400.0
output_interval_s = 10800.0
integrator = "sl_si"
minimum_fold_determinant = 0.2

[semilag]
quasi_monotone = true
trajectory_iterations = 3
extrapolation = "settls_departure"

[vertical]
coordinate = "ifs_class"
nlev = 80
p_top_pa = 100.0

[sponge]
base_pa = 5000.0
lid_relaxation_time_s = 600.0

[initial]
mode = "analysis"
analysis_grib = "cases/baseline-2026090100/gdas.t00z.pgrb2.0p25.f000"
analysis_mapping = "gdas-global"
surface_water_kg_m2 = 500.0

[physics]
mode = "arwen-native"
native_adapter_name = "arwen-cuda-column-suite-v1"
native_adapter_options = { acknowledgement = "device-pending-arwen-native-physics-v1", start_time_utc = "2026-09-01T00:00:00Z", radiation = "rrtmgp", radiation_interval_s = 3000.0, radiation_column_chunk = 5000, radiation_validation_mode = "fused", radiation_aerosol = "none", surface_layer = "sfclay", sfclay_option = 1, land_surface = "noah", land_surface_interval_s = 300.0, pbl = "satmedmf", ysu_topdown_pblmix = 1, microphysics = "morrison", morr_rimed_ice = 1, dx_m = 52100.0, orographic_drag = "kim-gwdo", cumulus = "ntiedtke", cumulus_column_chunk = 131072, ntiedtke_adjustment_time_factor = 0.35, nonorographic_gwd = "scinocca" }

# The semi-Lagrangian core's own drain (config.SEMILAG_DIFFUSION_ORDER,
# MEASURED 2026-09-07 on the dry T255 ladder): order 16 at 12 min at the
# truncation on the six-point gather keeps 0.973 / 0.915 / 1.025 / 0.965 of
# the Eulerian core's 500 hPa vorticity power at n = 61-120 / 121-180 /
# 181-230 / 231-255, where the cubic gather at order 8 and 36 min kept
# 0.835 / 0.576 / 0.474 / 0.502.
[diffusion]
enabled = true
order = 16
e_folding_time_s_at_truncation = 720.0
preserve_degree = 1

[semi_implicit]
enabled = true
weight = 1.0
off_centring_weight = 0.55

[repair]
mass_fixer = true
water_fixer = true
positivity_repair = true

[gates]
transform_roundtrip_relative_linf = 1.0e-6
transform_parseval_relative_error = 5.0e-7
mass_relative_drift = 1.0e-4
total_water_relative_drift = 1.0e-3
# physics_water_repair gate, NATIVE-suite sizing (2026-09-01).  The
# precision-wide 5e-4 envelope (runner._FIXER_ABSORPTION_LIMITS) was
# measured on the reference suite, which has no kernel-internal closure
# channel; the native suite has two -- Morrison's rainncv credited 1:1 to
# the reservoir vs the actual column debit its fp32 process arithmetic
# applies, and the post-kernel negative-species clamp (tolerance 1e-7 per
# level-species; the creation ceiling is order 3e-3 kg/m2 at 20 levels and
# the same order at 40, the column mass being the same) --
# both genuine fp32 accumulation, NOT booking routes: the CPU repro
# (water-repair-262, 2026-09-01, real model.step with verbatim-noah water
# arithmetic, 217,800 column-calls of drip/melt/partition/evap/dew/qfx
# forcing) put every booking route at <= 2 x 2^-14 = 1.22e-4 kg/m2, the
# same ledger-summation floor the reference suite reads (~1e-4).
# Measurement: day 1 of this config on the RTX 5090 (GDAS 2026-08-30 18Z,
# 1440 steps) read max repair 0.00262451171875 kg/m2 = exactly 43 x 2^-14,
# the fp32 quantum of the worst column's [512,1024) kg/m2 ledger total.
# Sizing: 4 x that measured max = 0.010498046875 = 43 x 2^-12, which
# admits the same 43-quantum excursion class on column totals up to the
# 4096 kg/m2 binade (the convicted-era worst columns totalled ~1150,
# where the class reads 5.25e-3) while staying 100x below the smallest
# booking-route conviction at run scale (1.0943603515625, precip
# double-entry, fixed 7d7b528d0) and 1e5 below the runoff-store
# conviction (1072, fixed 89571245d) -- the unbooked-route breakage this
# gate exists to catch.  Reference configs keep the 5e-4 envelope.
physics_water_repair_max_step_kg_m2 = 0.010498046875
